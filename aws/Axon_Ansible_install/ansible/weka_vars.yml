# weka_vars.yml -- ALL customer-modifiable values for the Ansible entry point.
# This is the Ansible equivalent of weka.conf: fill it once, both playbooks
# read it, and site.yml renders it into weka.conf for the underlying tooling.

# ---- identity ----------------------------------------------------------------
aws_region: "us-east-1"                 # CHANGEME
cluster_name: "weka-cluster1"           # CHANGEME: must also be in the IAM policy tag condition

# ---- your environment ----------------------------------------------------------
instance_type: "p6-b300.48xlarge"       # CHANGEME
ami_id: ""                              # CHANGEME: kernel <= 6.8
subnet_id: ""                           # CHANGEME
sg_ena: ""                              # CHANGEME
sg_efa: ""                              # CHANGEME on GPU/EFA platforms; else leave empty
instance_profile_arn: ""                # CHANGEME
launch_template_name: "weka-cluster1-lt"  # CHANGEME: explicit name (playbook launches by it)

# ---- cluster sizing --------------------------------------------------------------
expected_nodes: 8                       # CHANGEME
stripe_data: 6                          # DATA+PROTECTION <= node count
stripe_protection: 2
hot_spares: 1

# ---- WEKA core carve (drives the ENI count) ----------------------------------------
drive_cores: 4
compute_cores: 8
frontend_cores: 2

# ---- resource allocation -------------------------------------------------------------
drives_per_node: 0                      # 0 = all instance-store NVMe; N = only N
weka_core_ids: ""                       # pin WEKA to exact cores (cpulist syntax); empty = auto
excluded_core_ids: ""                   # cores WEKA must avoid (e.g. Slurm-owned)
weka_opt_volume_gb: "auto"              # dedicated /opt/weka EBS: auto | N | 0
root_volume_gb: 500

# ---- WEKA install source ----------------------------------------------------------------
weka_install_s3: ""                     # CHANGEME: s3://<bucket>/<weka-tarball>

# ---- launch behavior --------------------------------------------------------------------
# user_data_file: "scripts/userdata-el.sh"  # uncomment on RHEL-family AMIs (Rocky/Alma/RHEL):
                                        #   bakes SSM-agent install + SELinux-permissive into the template
launch_instances: true                  # false: you launch nodes yourself (e.g. via your own tooling)
capacity_reservation_id: ""             # cr-... for capacity blocks/ODCRs; empty = plain on-demand
capacity_block: false                   # true for capacity blocks (adds MarketType=capacity-block)

# ---- greenfield infrastructure (infra.yml only; delete if your VPC is ready) --------------
# Uncomment + fill to have infra.yml create the missing pieces (SGs, optional
# SSM endpoints, IAM role + instance profile) inside your EXISTING VPC, then
# copy its outputs into subnet_id/sg_ena/sg_efa/instance_profile_arn above.
# vpc_id: ""                            # existing VPC to create into
# account_id: ""                        # AWS account id (for the IAM policy)
# existing_subnet_id: ""                # use this subnet, skip subnet creation
# subnet_cidr: ""                       # OR create a subnet with this CIDR...
# availability_zone_id: ""              #   ...in this zone id (e.g. use1-az1)
# create_efa_sg: true                   # false for non-GPU instance types
# create_ssm_endpoints: false           # true if the subnet has no path to SSM
# endpoint_subnet_id: ""                # where to place the endpoints (default: cluster subnet)
# route_table_id: ""                    # associate a created subnet with this route table
