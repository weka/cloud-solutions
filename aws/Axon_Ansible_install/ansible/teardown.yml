---
# teardown.yml -- DESTROY a WEKA cluster and its deployment artifacts.
#
#   ansible-playbook -e @weka_vars.yml -e confirm=<cluster_name> teardown.yml
#
# Terminates every instance tagged weka-cluster=<cluster_name>, then deletes
# the deployment artifacts: the baseline SSM parameter, the admin secret in
# Secrets Manager, and the launch template. ALL CLUSTER DATA IS LOST.
#
# Guard: refuses to run unless `confirm` exactly matches `cluster_name` --
# pass it explicitly on the command line every time.

- name: Destroy WEKA cluster and artifacts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    confirm: ""

  tasks:
    - name: Confirmation gate
      ansible.builtin.assert:
        that:
          - confirm == cluster_name
        fail_msg: >-
          Refusing to destroy. This permanently terminates every instance
          tagged weka-cluster={{ cluster_name }} and deletes its secrets and
          parameters. To proceed: -e confirm={{ cluster_name }}

    - name: Find cluster instances
      ansible.builtin.shell: >-
        aws ec2 describe-instances --region {{ aws_region }}
        --filters Name=tag:weka-cluster,Values={{ cluster_name }}
        Name=instance-state-name,Values=running,pending,stopping,stopped
        --query 'Reservations[].Instances[].InstanceId' --output text | tr '\t' ' '
      register: nodes
      changed_when: false

    - name: Terminate cluster instances
      when: nodes.stdout | trim | length > 0
      ansible.builtin.command: >-
        aws ec2 terminate-instances --region {{ aws_region }}
        --instance-ids {{ nodes.stdout | trim }}
        --query 'length(TerminatingInstances)' --output text
      register: term
      changed_when: true

    - name: Delete baseline parameter
      ansible.builtin.command: >-
        aws ssm delete-parameter --region {{ aws_region }}
        --name /weka/{{ cluster_name }}/baseline
      register: param
      changed_when: param.rc == 0
      failed_when: param.rc != 0 and 'ParameterNotFound' not in param.stderr

    - name: Delete admin secret
      ansible.builtin.command: >-
        aws secretsmanager delete-secret --region {{ aws_region }}
        --secret-id weka/{{ cluster_name }}/admin --force-delete-without-recovery
      register: secret
      changed_when: secret.rc == 0
      failed_when: secret.rc != 0 and 'ResourceNotFoundException' not in secret.stderr

    - name: Delete launch template
      when: launch_template_name is defined and launch_template_name | length > 0
      ansible.builtin.command: >-
        aws ec2 delete-launch-template --region {{ aws_region }}
        --launch-template-name {{ launch_template_name }}
      register: lt
      changed_when: lt.rc == 0
      failed_when: lt.rc != 0 and 'NotFoundException' not in lt.stderr

    - name: Summary
      ansible.builtin.debug:
        msg: |
          Cluster {{ cluster_name }} destroyed:
            instances terminated : {{ (nodes.stdout | trim | split(' ') | length) if (nodes.stdout | trim | length > 0) else 0 }}
            baseline parameter   : {{ 'deleted' if param.changed else 'was already gone' }}
            admin secret         : {{ 'deleted' if secret.changed else 'was already gone' }}
            launch template      : {{ ('deleted' if lt.changed else 'was already gone') if (launch_template_name is defined and launch_template_name | length > 0) else 'not specified -- left in place' }}
