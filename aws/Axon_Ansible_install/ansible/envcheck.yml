---
# envcheck.yml -- environment preflight through Ansible. Run this FIRST, before
# infra.yml or site.yml, to verify the account-side prerequisites (runbook §3):
# subnet/VPC settings, egress path, S3 + SSM reachability, security group
# self-references, instance profile, AMI, instance-type availability, capacity
# reservation. Read-only; fails the play if any check FAILs.
#
#   ansible-playbook -e @weka_vars.yml envcheck.yml
#
# site.yml also runs this automatically as its first gate.

- name: WEKA environment preflight
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    pkg_dir: "{{ playbook_dir }}/.."
    nl: "\n"   # real newline for join()

  tasks:
    - name: Render weka.conf from Ansible variables
      ansible.builtin.template:
        src: templates/weka.conf.j2
        dest: "{{ pkg_dir }}/weka.conf"
        mode: "0644"

    - name: Run environment preflight (read-only)
      ansible.builtin.command: bash scripts/weka-env-preflight.sh
      args:
        chdir: "{{ pkg_dir }}"
      register: envpf
      changed_when: false
      failed_when: false

    - name: Environment preflight report
      ansible.builtin.debug:
        msg: |
          {{ envpf.stdout_lines | join(nl) }}

    - name: Gate on FAILs
      ansible.builtin.assert:
        that: envpf.rc == 0
        fail_msg: >-
          Environment preflight FAILed -- fix the [FAIL] lines above before
          deploying (runbook §3). Warnings do not block.
        success_msg: Environment preflight passed.
