# weka.conf -- single source of truth for all customer-modifiable values.
#
# Fill this ONE file; every script reads it and it OVERRIDES the defaults in
# each script's CUSTOMER CONFIGURATION block. Workstation scripts load it
# from the package root; deploy.sh ships it to nodes automatically.
# (Ansible path: do NOT edit this file -- it is rendered from
# ansible/weka_vars.yml on every playbook run.)
#
# The one value this file cannot reach: the CLUSTER_NAME inside
# iam/instance-policy.json (JSON cannot source shell) -- keep that in sync
# by hand (RUNBOOK §4).

# ---- identity ---------------------------------------------------------------
AWS_REGION="us-east-1"            # CHANGEME: deployment region
CLUSTER_NAME="weka-cluster1"      # CHANGEME: also goes in the IAM policy tag condition

# ---- your environment (used by generate-launch-template.sh) -----------------
INSTANCE_TYPE="p6-b300.48xlarge"  # CHANGEME: any type meeting WEKA minimums (RUNBOOK §2)
AMI_ID=""                         # CHANGEME: kernel <= 6.8 (RUNBOOK §5)
SUBNET_ID=""                      # CHANGEME: existing subnet in the reservation's AZ
#MGMT_SUBNET_ID=""                # optional: separate subnet for the mgmt ENI (same VPC+AZ)
#SG_MGMT=""                       # optional: separate SG for the mgmt ENI
SG_ENA=""                         # CHANGEME: existing SG for mgmt + WEKA data
SG_EFA=""                         # CHANGEME if EFA/GPU platform: self-referencing EFA SG
INSTANCE_PROFILE_ARN=""           # CHANGEME: from your IAM role (RUNBOOK §4)

# ---- cluster sizing ----------------------------------------------------------
EXPECTED_NODES=8                  # CHANGEME: backend node count
DATA=6                            # CHANGEME: stripe -- DATA+PROTECTION <= node count
PROTECTION=2
HOT_SPARES=1

# ---- WEKA core carve (drives the ENI count -- one data ENI per core) ---------
DRIVE_CORES=4
COMPUTE_CORES=8
FRONTEND_CORES=2

# ---- NVMe allocation -----------------------------------------------------------
DRIVES_PER_NODE=0                 # 0 = give WEKA ALL instance-store NVMe;
                                  # N = only N drives (selected NUMA-balanced),
                                  # e.g. 5 of the p6-b300's 8

# ---- core placement (Slurm coexistence) -----------------------------------------
WEKA_CORE_IDS=""                  # pin WEKA to EXACTLY these cores ("1-4,49-52");
                                  # count must equal the carve total. Empty = auto
EXCLUDED_CORE_IDS=""              # cores WEKA must NOT use (e.g. Slurm-owned);
                                  # discovery prints the slurm.conf CpuSpecList either way

# ---- /opt/weka volume ------------------------------------------------------------
WEKA_OPT_VOLUME_GB="auto"         # dedicated EBS volume for /opt/weka (isolates WEKA
                                  # software/logs/traces from the root filesystem).
                                  # "auto" = 48 + 10/WEKA-core (official WEKA sizing);
                                  # N = N GiB; 0 = share the root volume

# ---- WEKA install source ------------------------------------------------------
WEKA_INSTALL_S3=""                # CHANGEME (preferred): s3://<bucket>/<weka-tarball>
#WEKA_INSTALL_URL=""              # alternative: get.weka.io or presigned URL

# ---- optional overrides (uncomment to change script defaults) ------------------
#ROOT_VOLUME_GB=500
#EFA_COUNT="auto"
#DRIVE_RAM_PER_CORE_GB=2.5
#COMPUTE_RAM_PER_CORE_GB=8
#FRONTEND_RAM_PER_CORE_GB=2.5
#ROTATE_ADMIN_PASSWORD=true
#SSM_TIMEOUT=1200
